<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .tile { fill: #fdfdfc; stroke: #e4e4e0; }
    .ring { stroke: #1c1c1a; }
    .bar  { fill: #1f5fbf; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #121211; stroke: #2c2c29; }
      .ring { stroke: #e8e8e4; }
      .bar  { fill: #8ab8ff; }
    }
  </style>
  <rect class="tile" x="1" y="1" width="62" height="62" rx="14" stroke-width="2"/>
  <ellipse class="ring" cx="32" cy="32" rx="14.5" ry="19" fill="none" stroke-width="6.5"/>
  <rect class="bar" x="19" y="28.75" width="26" height="6.5" rx="1.5"/>
</svg>
